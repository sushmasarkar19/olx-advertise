spring.application.name=olx-advertise

spring.datasource.url=jdbc:mysql://localhost:3306/olxadvertise
spring.datasource.username=root
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ── Feign Client Configuration ─────────────────────────────────────────────
# Enable Feign fallbacks via Spring Cloud CircuitBreaker
feign.circuitbreaker.enabled=true

# Feign full logging - shows exact request/response bodies to/from masterdata and login
feign.client.config.default.loggerLevel=FULL
logging.level.com.sushma.olxadvertise.client=DEBUG
logging.level.com.sushma.olxadvertise.client.helper=DEBUG

# ── Eureka Service Discovery Configuration ──────────────────────────────────
# Register this service with Eureka so other services can discover it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ── Server Configuration ───────────────────────────────────────────────────
server.port=8083